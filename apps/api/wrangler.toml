name = "rn-cf-api"
main = "src/index.ts"
compatibility_date = "2026-07-15"
compatibility_flags = ["nodejs_compat"]

# Non-secret defaults and secrets are managed by varlock (.env.schema / .env).
# Use `pnpm --filter @rn-cf/api dev` (varlock-wrangler) so bindings are injected.

[[d1_databases]]
binding = "DB"
database_name = "rn-cf"
# Replace with the id from `wrangler d1 create rn-cf`
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[[send_email]]
name = "EMAIL"

[[queues.producers]]
binding = "BILLING_QUEUE"
queue = "rn-cf-billing-events"

[[queues.consumers]]
queue = "rn-cf-billing-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 30
dead_letter_queue = "rn-cf-billing-events-dlq"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
invocation_logs = true
