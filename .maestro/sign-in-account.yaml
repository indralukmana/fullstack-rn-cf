appId: com.rncf.launchpad
tags:
  - smoke
  - auth
---
# Sign in with the local demo owner, open Account, assert primary chrome.
# Requires DEMO_PASSWORD (and optional DEMO_EMAIL) via `maestro test -e …`.
# Prefer testID / id selectors so copy changes do not break the flow.
- launchApp:
    clearState: true
- assertVisible: "RN CF"
- tapOn:
    id: "home-sign-in"
- tapOn:
    id: "auth-email"
- inputText: ${DEMO_EMAIL || "owner@example.com"}
- tapOn:
    id: "auth-password"
- inputText: ${DEMO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-sign-in-submit"
- tapOn:
    id: "home-account"
- scrollUntilVisible:
    element:
      id: "account-subscription"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "account-nav-notes"
- scrollUntilVisible:
    element:
      id: "account-sign-out"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "account-sign-out"
